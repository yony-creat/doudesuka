<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일본어 회화 연습 (p.73 & 대화 연습)</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --success: #16a34a;
      --error: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { max-width: 650px; width: 100%; background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { font-size: 1.5rem; color: var(--primary); margin-bottom: 5px; }
    .progress-bar { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-top: 15px; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }

    .card { background: #f1f5f9; border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 2px solid #e2e8f0; }
    .question-box { text-align: center; }
    .question-title { font-size: 0.9rem; color: #64748b; margin-bottom: 5px; }
    .question-text { font-size: 1.4rem; font-weight: bold; color: #0f172a; margin-bottom: 10px; }
    
    .btn-speaker { background: #e0e7ff; color: var(--primary); border: none; padding: 6px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; }
    .btn-speaker:hover { background: #c7d2fe; }

    .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .answer-card { background: #fff; border: 2px solid #cbd5e1; border-radius: 12px; padding: 15px; text-align: center; }
    .answer-label { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; margin-bottom: 8px; }
    .label-b1 { background: #dcfce7; color: #15803d; }
    .label-b2 { background: #fee2e2; color: #b91c1c; }
    .answer-jp { font-size: 1.1rem; font-weight: bold; margin-bottom: 4px; }
    .answer-kr { font-size: 0.85rem; color: #64748b; }

    .mode-toggle { text-align: center; margin-bottom: 15px; }
    .mode-btn { background: none; border: none; color: #64748b; text-decoration: underline; cursor: pointer; font-size: 0.9rem; }

    /* Voice Mode */
    .voice-section { text-align: center; padding: 20px 0; }
    .mic-btn { width: 80px; height: 80px; border-radius: 50%; background: #ef4444; border: none; color: white; font-size: 1.8rem; cursor: pointer; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); transition: transform 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 15px auto; }
    .mic-btn.listening { animation: pulse 1.2s infinite; background: #dc2626; }
    .mic-btn-text { font-size: 0.75rem; margin-top: 2px; }
    @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1.08); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { transform: scale(1); } }

    .result-box { min-height: 40px; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; font-size: 1rem; color: #334155; margin-top: 10px; word-break: break-all; }
    .feedback { text-align: center; font-weight: bold; margin-top: 15px; padding: 12px; border-radius: 10px; display: none; }
    .feedback.correct { background: #dcfce7; color: #15803d; display: block; }
    .feedback.wrong { background: #fee2e2; color: #b91c1c; display: block; }

    /* Puzzle Mode */
    .puzzle-section { display: none; }
    .target-select { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .target-btn { padding: 8px 16px; border-radius: 8px; border: 2px solid #cbd5e1; background: #fff; cursor: pointer; font-weight: bold; }
    .target-btn.active { border-color: var(--primary); background: #e0e7ff; color: var(--primary); }

    .puzzle-workspace { background: #fff; border: 2px dashed #cbd5e1; border-radius: 12px; min-height: 60px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 15px; }
    .puzzle-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .word-chip { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 8px 14px; border-radius: 8px; font-size: 1rem; cursor: pointer; user-select: none; transition: all 0.2s; }
    .word-chip:hover { background: #e2e8f0; }

    .btn-submit { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-submit:hover { background: var(--primary-hover); }

    .score-board { text-align: center; margin-top: 20px; font-weight: bold; color: #64748b; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>일본어 회화 연습 (p.73 & 대화 연습)</h1>
    <div class="score-board"><span id="current-step">1</span> / <span id="total-step">6</span> 문제</div>
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  </div>

  <div class="card question-box">
    <div class="question-title">질문 (A)를 듣고 답해보세요</div>
    <div class="question-text" id="q-text">1. あの おんせんは どうですか。</div>
    <button class="btn-speaker" onclick="playQuestionTTS()">🔊 질문 다시 듣기</button>
  </div>

  <div class="answers-grid">
    <div class="answer-card">
      <span class="answer-label label-b1">B1 (응답 1)</span>
      <div class="answer-jp" id="b1-jp">とても ゆうめいです。</div>
      <div class="answer-kr" id="b1-kr">매우 유명합니다.</div>
      <button class="btn-speaker" style="font-size:0.8rem; margin-top:8px;" onclick="playTTS(questions[currentIdx].b1_text)">🔊 듣기</button>
    </div>
    <div class="answer-card">
      <span class="answer-label label-b2">B2 (응답 2)</span>
      <div class="answer-jp" id="b2-jp">あまり ゆうめいじゃ ありません。</div>
      <div class="answer-kr" id="b2-kr">그다지 유명하지 않습니다.</div>
      <button class="btn-speaker" style="font-size:0.8rem; margin-top:8px;" onclick="playTTS(questions[currentIdx].b2_text)">🔊 듣기</button>
    </div>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn" id="toggle-mode-btn" onclick="toggleMode()">⌨️ 마이크가 안 되나요? 단어 조합 모드로 변경</button>
  </div>

  <!-- 음성 말하기 모드 -->
  <div class="voice-section" id="voice-section">
    <button class="mic-btn" id="mic-btn" onclick="toggleListening()">
      🎙️
      <span class="mic-btn-text" id="mic-text">말하기</span>
    </button>
    <div style="font-size: 0.85rem; color: #64748b;">버튼을 누르고 B1 또는 B2 문장을 말하세요.</div>
    <div class="result-box" id="speech-result">🎙️ 인식 결과 (히라가나 변환): </div>
  </div>

  <!-- 단어 조합 퍼즐 모드 -->
  <div class="puzzle-section" id="puzzle-section">
    <div class="target-select">
      <button class="target-btn active" id="target-b1" onclick="setTarget('b1')">B1 대답 만들기</button>
      <button class="target-btn" id="target-b2" onclick="setTarget('b2')">B2 대답 만들기</button>
    </div>
    <div class="puzzle-workspace" id="puzzle-workspace"></div>
    <div class="puzzle-pool" id="puzzle-pool"></div>
    <button class="btn-submit" onclick="checkPuzzle()">정답 제출하기</button>
  </div>

  <div class="feedback" id="feedback-msg"></div>
</div>

<script>
  const questions = [
    {
      q_display: "あの おんせんは どうですか。", // '온센와'로 수정
      q_tts: "あの おんせんは どうですか。",
      b1_text: "とても ゆうめいです。",
      b2_text: "あまり ゆうめいじゃ ありません。",
      b1_kr: "매우 유명합니다.",
      b2_kr: "그다지 유명하지 않습니다.",
      b1_raw: "とてもゆうめいです",
      b2_raw: "あまりゆうめいじゃありません",
      puzzle_b1: ["とても", "ゆうめい", "です"],
      puzzle_b2: ["あまり", "ゆうめい", "じゃ", "ありません"],
      distractors_b1: ["あまり", "ゆうめいっく", "じゃ"],
      distractors_b2: ["とても", "ゆうめいっく", "くありません", "ありませんでした"]
    },
    {
      q_display: "その スマホは どうですか。",
      q_tts: "その スマホは どうですか。",
      b1_text: "とても べんりです。",
      b2_text: "あまり べんりじゃ ありません。",
      b1_kr: "매우 편리합니다.",
      b2_kr: "그다지 편리하지 않습니다.",
      b1_raw: "とてもべんりです",
      b2_raw: "あまりべんりじゃありません",
      puzzle_b1: ["とても", "べんり", "です"],
      puzzle_b2: ["あまり", "べんり", "じゃ", "ありません"],
      distractors_b1: ["あまり", "べんりっく", "じゃ"],
      distractors_b2: ["```html
      distractors_b1: ["あまり", "べんりっく", "じゃ"],
      distractors_b2: ["とても", "べんりっく", "くありません", "ありませんでした"]
    },
    {
      q_display: "この 町は どうですか。",
      q_tts: "この まちは どうですか。", // 'まち' 훈독 고정
      b1_text: "とても にぎやかです。",
      b2_text: "あまり にぎやかじゃ ありません。",
      b1_kr: "매우 번화합니다.",
      b2_kr: "그다지 번화하지 않습니다.",
      b1_raw: "とてもにぎやかです",
      b2_raw: "あまりにぎやかじゃありません",
      puzzle_b1: ["とても", "にぎやか", "です"],
      puzzle_b2: ["あまり", "にぎやか", "じゃ", "ありません"],
      distractors_b1: ["あまり", "にぎやかっく", "じゃ"],
      distractors_b2: ["```html
      distractors_b1: ["あまり", "にぎやかっく", "じゃ"],
      distractors_b2: ["とても", "にぎやかっく", "くありません", "ありませんでした"]
    },
    {
      q_display: "あの びょういんは どうですか。",
      q_tts: "あの びょういんは どうですか。",
      b1_text: "とても しんせつです。",
      b2_text: "あまり しんせつじゃ ありません。",
      b1_kr: "매우 친절합니다.",
      b2_kr: "그다지 친절하지 않습니다.",
      b1_raw: "とてもしんせつです",
      b2_raw: "あまりしんせつじゃありません",
      puzzle_b1: ["とても", "しんせつ", "です"],
      puzzle_b2: ["あまり", "しんせつ", "じゃ", "ありません"],
      distractors_b1: ["あまり", "しんせっく", "じゃ"],
      distractors_b2: ["とても", "しんせっく", "くありません", "ありませんでした"]
    },
    {
      /* 새로 추가된 문항 1 (신칸센 안 후지산 대화) */
      q_display: "あれが ふじさんです。",
      q_tts: "あれが ふじさんです。",
      b1_text: "きれいですね。",
      b2_text: "あまり きれいじゃ ありません。",
      b1_kr: "예쁘네요. / 아름답네요.",
      b2_kr: "그다지 예쁘지 않습니다.",
      b1_raw: "きれいですね",
      b2_raw: "あまりきれいじゃありません",
      puzzle_b1: ["きれい", "ですね"],
      puzzle_b2: ["あまり", "きれい", "じゃ", "ありません"],
      distractors_b1: ["あまり", "きれいっく", "です"],
      distractors_b2: ["とても", "きれいっく", "くありません", "ありませんでした"]
    },
    {
      /* 새로 추가된 문항 2 (공원 산책 대화) */
      q_display: "この こうえん、きれいだね。",
      q_tts: "この こうえん きれいだね",
      b1_text: "うん。ごみ ひとつ ないね。",
      b2_text: "あまり きれいじゃ ないね。",
      b1_kr: "응. 쓰레기 하나 없네.",
      b2_kr: "그다지 깨끗하지 않네.",
      b1_raw: "うんごみひとつないね",
      b2_raw: "あまりきれいじゃないね",
      puzzle_b1: ["うん", "ごみ", "ひとつ", "ないね"],
      puzzle_b2: ["あまり", "きれい", "じゃ", "ないね"],
      distractors_b1: ["あまり", "ふたつ", "ありません"],
      distractors_b2: ["とても", "きれいっく", "ありませんでした"]
    }
  ];

  let currentIdx = 0;
  let isListening = false;
  let recognition = null;
  let currentMode = 'voice'; // 'voice' or 'puzzle'
  let currentTarget = 'b1';
  let userWorkspace = [];

  // 한자 -> 히라가나 자동 변환기 (甘利, 町 -> まち 고정 포함)
  function convertKanjiToHiragana(text) {
    if (!text) return "";
    return text
      .replace(/甘利/g, "あまり").replace(/余り/g, "あまり")
      .replace(/有名/g, "ゆうめい")
      .replace(/便利/g, "べんり")
      .replace(/町/g, "まち").replace(/ちょう/g, "まち").replace(/この町/g, "このまち")
      .replace(/病院/g, "びょういん")
      .replace(/温泉/g, "おんせん")
      .replace(/富士山/g, "ふじさん")
      .replace(/公園/g, "こうえん")
      .replace(/ゴミ/g, "ごみ")
      .replace(/\s+/g, "");
  }

  // 초기화
  window.onload = () => {
    loadQuestion(0);
    initSpeech();
  };

  function loadQuestion(idx) {
    currentIdx = idx;
    const q = questions[idx];
    document.getElementById('q-text').innerText = `${idx + 1}. ${q.q_display}`;
    document.getElementById('b1-jp').innerText = q.b1_text;
    document.getElementById('b1-kr').innerText = q.b1_kr;
    document.getElementById('b2-jp').innerText = q.b2_text;
    document.getElementById('b2-kr').innerText = q.b2_kr;
    document.getElementById('current-step').innerText = idx + 1;
    document.getElementById('total-step').innerText = questions.length;
    document.getElementById('progress').style.width = `${((idx + 1) / questions.length) * 100}%`;
    document.getElementById('speech-result').innerText = "🎙️ 인식 결과 (히라가나 변환): ";
    hideFeedback();

    setTimeout(() => playQuestionTTS(), 500);
    if (currentMode === 'puzzle') initPuzzle();
  }

  function playTTS(text) {
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'ja-JP';
    utt.rate = 0.9;
    window.speechSynthesis.speak(utt);
  }

  function playQuestionTTS() {
    playTTS(questions[currentIdx].q_tts);
  }

  // Speech Recognition
  function initSpeech() {
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Speech) {
      document.getElementById('speech-result').innerText = "⚠️ 이 브라우저는 음성 인식을 지원하지 않습니다. 단어 조합 모드를 이용해주세요.";
      return;
    }
    recognition = new Speech();
    recognition.lang = 'ja-JP';
    recognition.interimResults = false;

    recognition.onstart = () => {
      isListening = true;
      document.getElementById('mic-btn').classList.add('listening');
      document.getElementById('mic-text').innerText = "듣는 중...";
    };

    recognition.onend = () => {
      isListening = false;
      document.getElementById('mic-btn').classList.remove('listening');
      document.getElementById('mic-text').innerText = "말하기";
    };

    recognition.onresult = (e) => {
      const rawText = e.results[0][0].transcript;
      const converted = convertKanjiToHiragana(rawText);
      document.getElementById('speech-result').innerText = `🎙️ 인식 결과 (히라가나 변환): ${converted}`;
      
      checkVoiceAnswer(converted);
    };

    recognition.onerror = () => {
      showFeedback(false, "음성을 인식하지 못했습니다. 다시 명확하게 말해보세요!");
    };
  }

  function toggleListening() {
    if (!recognition) return;
    if (isListening) recognition.stop();
    else recognition.start();
  }

  function checkVoiceAnswer(userStr) {
    const q = questions[currentIdx];
    const target1 = q.b1_raw.replace(/\s+/g, "");
    const target2 = q.b2_raw.replace(/\s+/g, "");
    
    // じゃ/では 모두 호환 인정
    const userNormalized = userStr.replace(/では/g, "じゃ");

    if (userNormalized.includes(target1) || userNormalized.includes(target2)) {
      showFeedback(true, "🎉 정확한 발음입니다! 정답입니다.");
      setTimeout(nextQuestion, 1800);
    } else {
      showFeedback(false, "❌ 발음이나 문장이 보기와 일치하지 않습니다. 다시 말해보세요!");
    }
  }

  // Mode Toggle
  function toggleMode() {
    if (currentMode === 'voice') {
      currentMode = 'puzzle';
      document.getElementById('voice-section').style.display = 'none';
      document.getElementById('puzzle-section').style.display = 'block';
      document.getElementById('toggle-mode-btn').innerText = "🎙️ 음성 말하기 모드로 변경";
      initPuzzle();
    } else {
      currentMode = 'voice';
      document.getElementById('voice-section').style.display = 'block';
      document.getElementById('puzzle-section').style.display = 'none';
      document.getElementById('toggle-mode-btn').innerText = "⌨️ 마이크가 안 되나요? 단어 조합 모드로 변경";
    }
  }

  function setTarget(target) {
    currentTarget = target;
    document.getElementById('target-b1').classList.toggle('active', target === 'b1');
    document.getElementById('target-b2').classList.toggle('active', target === 'b2');
    initPuzzle();
  }

  function initPuzzle() {
    userWorkspace = [];
    renderWorkspace();
    
    const q = questions[currentIdx];
    const correctPieces = currentTarget === 'b1' ? q.puzzle_b1 : q.puzzle_b2;
    const distractors = currentTarget === 'b1' ? q.distractors_b1 : q.distractors_b2;
    
    const pool = [...correctPieces, ...distractors].sort(() => Math.random() - 0.5);
    
    const poolContainer = document.getElementById('puzzle-pool');
    poolContainer.innerHTML = "";
    pool.forEach((word, idx) => {
      const chip = document.createElement('div');
      chip.className = 'word-chip';
      chip.innerText = word;
      chip.onclick = () => selectWord(word, chip);
      poolContainer.appendChild(chip);
    });
  }

  function selectWord(word, chipEl) {
    userWorkspace.push(word);
    chipEl.style.visibility = 'hidden';
    renderWorkspace();
  }

  function renderWorkspace() {
    const ws = document.getElementById('puzzle-workspace');
    ws.innerHTML = "";
    userWorkspace.forEach((word, idx) => {
      const chip = document.createElement('div');
      chip.className = 'word-chip';
      chip.style.background = '#e0e7ff';
      chip.style.borderColor = '#818cf8';
      chip.innerText = word;
      chip.onclick = () => removeWord(idx);
      ws.appendChild(chip);
    });
  }

  function removeWord(removeIdx) {
    const removed = userWorkspace.splice(removeIdx, 1)[0];
    renderWorkspace();
    
    const poolChips = document.getElementById('puzzle-pool').children;
    for (let chip of poolChips) {
      if (chip.innerText === removed && chip.style.visibility === 'hidden') {
        chip.style.visibility = 'visible';
        break;
      }
    }
  }

  function checkPuzzle() {
    const q = questions[currentIdx];
    const correctArr = currentTarget === 'b1' ? q.puzzle_b1 : q.puzzle_b2;
    
    const userAns = userWorkspace.join("");
    const correctAns = correctArr.join("");

    if (userAns === correctAns) {
      showFeedback(true, "🎉 단어 조합 성공! 정답입니다.");
      playTTS(currentTarget === 'b1' ? q.b1_text : q.b2_text);
      setTimeout(nextQuestion, 1800);
    } else {
      showFeedback(false, "❌ 올바른 어순이 아닙니다. 함정 단어를 피해서 다시 조합해보세요!");
    }
  }

  function showFeedback(isSuccess, msg) {
    const fb = document.getElementById('feedback-msg');
    fb.className = `feedback ${isSuccess ? 'correct' : 'wrong'}`;
    fb.innerText = msg;
  }

  function hideFeedback() {
    document.getElementById('feedback-msg').style.display = 'none';
  }

  function nextQuestion() {
    if (currentIdx + 1 < questions.length) {
      loadQuestion(currentIdx + 1);
    } else {
      alert("🎊 모든 연습 문제를 다 풀었습니다! 수고하셨습니다.");
      loadQuestion(0);
    }
  }
</script>

</body>
</html>
